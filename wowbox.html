<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مولد Secret Key من الرقم</title>
    <style>
        :root {
            --bg-color: #0b0f19;
            --card-bg: #151d30;
            --accent-color: #3b82f6;
            --text-color: #f8fafc;
            --text-muted: #64748b;
            --success-color: #10b981;
            --border-color: #22314d;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            background-color: var(--card-bg);
            padding: 35px 30px;
            border-radius: 20px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.4);
            width: 100%;
            max-width: 460px;
            border: 1px solid var(--border-color);
        }

        h2 {
            text-align: center;
            margin-bottom: 25px;
            font-size: 24px;
            font-weight: 600;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 500;
            text-align: right;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            background-color: var(--bg-color);
            color: white;
            font-size: 15px;
            outline: none;
            transition: all 0.25s ease;
        }

        input:focus {
            border-color: var(--accent-color);
            box-shadow: 0 0 0 3px rgba(59, 130, 246, 0.15);
        }

        .result-wrapper {
            display: flex;
            align-items: center;
            gap: 10px;
            margin-top: 25px;
        }

        .result-box {
            flex-grow: 1;
            background-color: var(--bg-color);
            padding: 16px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
            text-align: left;
            direction: ltr;
        }

        .result-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 6px;
            text-align: right;
            direction: rtl;
        }

        .result-value {
            font-size: 16px;
            font-weight: 700;
            color: var(--success-color);
            word-break: break-all;
            font-family: monospace;
            letter-spacing: 1px;
            min-height: 27px;
            text-transform: lowercase;
        }

        /* تصميم زر النسخ المطابق تماماً للـ index.html الناجح */
        .icon-btn {
            width: 50px;
            height: 55px;
            padding: 0;
            border-radius: 12px;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1e293b;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
            flex-shrink: 0;
        }

        .icon-copy {
            position: relative;
            width: 14px;
            height: 14px;
        }

        .icon-copy::before {
            content: '';
            width: 10px;
            height: 12px;
            border: 2px solid #94a3b8;
            border-radius: 2px;
            position: absolute;
            transform: translate(-2px, -2px);
            background: #1e293b;
        }
        .icon-copy::after {
            content: '';
            width: 10px;
            height: 12px;
            border: 2px solid #94a3b8;
            border-radius: 2px;
            position: absolute;
            transform: translate(2px, 2px);
        }

        .icon-btn:hover {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .icon-btn:hover .icon-copy::before,
        .icon-btn:hover .icon-copy::after {
            border-color: white;
        }

        .icon-btn.copied {
            background-color: var(--success-color) !important;
            border-color: var(--success-color);
        }
        .icon-btn.copied .icon-copy::before,
        .icon-btn.copied .icon-copy::after {
            display: none;
        }
        .icon-btn.copied::before {
            content: '✓';
            color: white;
            font-size: 18px;
            font-weight: bold;
        }
    </style>

        .drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1001; display: none; }

        .drawer.open { right: 0; }
        .drawer-header { background: var(--drawer-bg); color: var(--drawer-text); height: 56px !important; line-height: 56px !important; padding: 0 15px !important; font-weight: bold; text-align: right; box-sizing: border-box; overflow: hidden !important; border-bottom: 1px solid rgba(0,0,0,0.1); }
        .drawer-menu-container { flex: 1; overflow-y: auto; scroll-behavior: smooth; -webkit-overflow-scrolling: touch; }
        .drawer-menu-container::-webkit-scrollbar { display: none; }
        .drawer-menu { list-style: none; padding: 10px 0; margin: 0; direction: rtl; }
        .drawer-item { padding: 15px 20px; border-bottom: 1px solid rgba(0,0,0,0.05); cursor: pointer; display: flex; justify-content: space-between; align-items: center; color: var(--drawer-text); transition: all 0.2s ease; outline: none; -webkit-tap-highlight-color: transparent; }
        .drawer-item:hover { background-color: rgba(0,0,0,0.05); transform: translateX(-4px); }
        .drawer-item:active { background-color: rgba(0,0,0,0.1) !important; transform: scale(0.98) !important; transition: transform 0.05s ease; }

.dl123 {

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<body>
<!-- START ADMIN DRAWER -->
<header>
    <div style="display: flex; align-items: center; gap: 15px;">
        <button class="menu-btn-container" id="menuBtnToggle" onclick="toggleDrawer()">
            <div class="menu-bar-line"></div>
            <div class="menu-bar-line"></div>
            <div class="menu-bar-line"></div>
        </button>
        <span id="pageMainHeader" style="font-weight:bold; font-size: 1.1rem; display: inline-block; vertical-align: middle;">wowbox</span>
    </div>
    <div class="dl123" id="userThemeToggleBtn" onclick="toggleUserTheme()"><i class="fa-solid fa-moon"></i></div>
</header>
<div class="drawer-overlay" id="drawerOverlay" onclick="toggleDrawer()"></div>
<nav class="drawer" id="drawer">
    <div class="drawer-header" id="drawerSideHeader">wowbox</div>
    <div id="drawerLoader" class="drawer-loader"></div>
    <div class="drawer-menu-container">
        <ul class="drawer-menu" id="drawerDynamicMenu"></ul>
    </div>
</nav>
<!-- END ADMIN DRAWER -->

    <div class="container">
        <h2>مولد Secret Key من الرقم</h2>
        
        <div class="form-group">
            <label>أدخل الرقم المراد تحويله (مثال: 640578)</label>
            <input type="text" id="input-number" value="640578" placeholder="اكتب الرقم هنا..." oninput="convertNumberToBase32()">
        </div>

        <div class="result-wrapper">
            <div class="result-box">
                <div class="result-label">المفتاح السري الناتج:</div>
                <div class="result-value" id="output-secret">-</div>
            </div>
            <!-- زر النسخ بنفس ميكانيزم الـ index.html الناجح -->
            <button class="icon-btn" onclick="copyCode(this)" title="نسخ المفتاح"><div class="icon-copy"></div></button>
        </div>
    </div>

    <script>
        const Base32Encoder = {
            charSet: "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567",
            encode(buffer) {
                let bytes = new Uint8Array(buffer);
                let bits = 0;
                let value = 0;
                let output = '';

                for (let i = 0; i < bytes.length; i++) {
                    value = (value << 8) | bytes[i];
                    bits += 8;

                    while (bits >= 5) {
                        output += this.charSet[(value >>> (bits - 5)) & 31];
                        bits -= 5;
                    }
                }

                if (bits > 0) {
                    output += this.charSet[(value << (5 - bits)) & 31];
                }

                return output;
            }
        };

        function convertNumberToBase32() {
            const inputVal = document.getElementById("input-number").value.trim();
            const outputDiv = document.getElementById("output-secret");

            if (!inputVal) {
                outputDiv.innerText = "-";
                return;
            }

            try {
                let seedText = inputVal;
                while (seedText.length < 20) {
                    seedText += inputVal;
                }

                const encoder = new TextEncoder();
                const uint8Array = encoder.encode(seedText);
                let rawBase32 = Base32Encoder.encode(uint8Array);

                let formattedKey = rawBase32.match(/.{1,4}/g).join(' ');
                outputDiv.innerText = formattedKey;
            } catch (e) {
                outputDiv.innerText = "حدث خطأ أثناء المعالجة";
            }
        }

        // نفس دالة النسخ الحرفية والمجرّبة 100% من الـ index.html السابق
        function copyCode(button) {
            const codeElem = document.getElementById("output-secret");
            if (!codeElem || codeElem.innerText === "-") return;
            
            const cleanCode = codeElem.innerText.replace(/\s+/g, '');
            
            const textArea = document.createElement("textarea");
            textArea.value = cleanCode;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                button.classList.add("copied");
                setTimeout(() => {
                    button.classList.remove("copied");
                }, 1500);
            } catch (err) {
                if (window.Android) {
                    Android.callAndroidBlock("فشلٌ في نسخ المفتاح");
                } else {
                    alert("فشلٌ في نسخ المفتاح");
                }
            }
            document.body.removeChild(textArea);
        }

        window.onload = convertNumberToBase32;
    </script>
<script id="admin-scripts">
    const username = "BLOXMAM";
    const repo = "TOTP";
    const currentFileName = "wowbox.html";

    function initUserTheme() {
        const toggleBtn = document.getElementById("userThemeToggleBtn");
        const saved = localStorage.getItem("user-theme") || "light";
        if(saved === "dark") {
            document.documentElement.setAttribute("data-user-theme", "dark");
            if(toggleBtn) toggleBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
        } else {
            document.documentElement.removeAttribute("data-user-theme");
            if(toggleBtn) toggleBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
        }
    }

    function toggleUserTheme() {
        const toggleBtn = document.getElementById("userThemeToggleBtn");
        const current = document.documentElement.getAttribute("data-user-theme");
        if(current === "dark") {
            document.documentElement.removeAttribute("data-user-theme");
            localStorage.setItem("user-theme", "light");
            if(toggleBtn) toggleBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
        } else {
            document.documentElement.setAttribute("data-user-theme", "dark");
            localStorage.setItem("user-theme", "dark");
            if(toggleBtn) toggleBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
        }
    }

    function toggleDrawer() {
        const drawer = document.getElementById("drawer");
        const overlay = document.getElementById("drawerOverlay");
        const menuBtn = document.getElementById("menuBtnToggle");
        
        drawer.classList.toggle("open");
        
        if(drawer.classList.contains("open")) {
            overlay.style.display = "block";
            menuBtn.classList.add("active-icon");
        } else {
            overlay.style.display = "none";
            menuBtn.classList.remove("active-icon");
        }
    }

    function renderDrawerContent(orderedPages) {
        const drawerMenu = document.getElementById("drawerDynamicMenu");
        drawerMenu.innerHTML = "";
        const currentPageData = orderedPages.find(p => p.file === currentFileName);
        if (currentPageData && currentPageData.title) {
            document.getElementById("pageMainHeader").innerText = currentPageData.title;
            if(document.getElementById("drawerSideHeader")) document.getElementById("drawerSideHeader").innerText = currentPageData.title;
            if(document.getElementById("pageContentTitle")) document.getElementById("pageContentTitle").innerText = currentPageData.title;
            document.title = currentPageData.title;
        }
        orderedPages.forEach(page => {
            const li = document.createElement("li");
            li.className = "drawer-item";
            li.innerHTML = "<span>" + page.title + "</span>";
            li.onclick = () => {
                if (typeof Android !== "undefined" && Android.openLocalPage) {
                    Android.openLocalPage(page.file);
                } else {
                    window.location.href = page.file;
                }
            };
            drawerMenu.appendChild(li);
        });
    }

    async function loadGlobalVars() {
        try {
            const res = await fetch("var.json");
            if(res.ok) {
                const data = await res.json();
                const styleEl = document.createElement("style");
                let cssStr = ":root {\n";
                for(let k in data.light) { cssStr += `  ${k}: ${data.light[k]};\n`; }
                cssStr += "}\n[data-user-theme='dark'] {\n";
                for(let k in data.dark) { cssStr += `  ${k}: ${data.dark[k]};\n`; }
                cssStr += "}";
                styleEl.innerHTML = cssStr;
                document.head.appendChild(styleEl);
            }
        } catch(e) { console.log("خطأ في تطبيق المتغيرات العامة"); }
    }

    async function initDrawer() {
        initUserTheme();
        await loadGlobalVars();
        const loader = document.getElementById("drawerLoader");
        let loadedSuccessfully = false;
        try {
            if (typeof Android !== "undefined" && Android.readLocalFile) {
                const localData = Android.readLocalFile("order.json");
                if (localData && localData.trim() !== "") {
                    const orderedPages = JSON.parse(localData);
                    renderDrawerContent(orderedPages);
                    loadedSuccessfully = true;
                }
            }
            if (!loadedSuccessfully) {
                const res = await fetch(`order.json`);
                if (res.ok) {
                    const orderedPages = await res.json();
                    renderDrawerContent(orderedPages);
                    loadedSuccessfully = true;
                } else { throw new Error(); }
            }
        } catch(e) { 
            if (!loadedSuccessfully) {
                try {
                    const resAlt = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/order.json`);
                    const dataAlt = await resAlt.json();
                    const decodedContent = decodeURIComponent(escape(atob(dataAlt.content.replace(/\s/g, ""))));
                    renderDrawerContent(JSON.parse(decodedContent));
                } catch(err) { console.log("خطأ في جلب الهيدر"); }
            }
        } finally {
            if(loader) loader.style.display = "none";
        }
    }
    initDrawer();
</script>
