        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;

        }

        label {
            display: block;
            margin-bottom: 8px;
            color: #94a3b8;
            font-size: 13px;
            font-weight: 500;
            text-align: right;
        }

        input {
            width: 100%;
            padding: 14px;
            border: 2px solid var(--border-color);
            border-radius: 10px;
            background-color: var(--input-bg);
            color: white;
            font-size: 15px;

        input:focus {

        button {
            width: 100%;
            padding: 14px;
            background-color: var(--accent-color);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s ease;
        }

        button:hover {
            background-color: #2563eb;
            transform: translateY(-1px);
        }

        .account-list {
            margin-top: 25px;
            max-height: 290px;
            overflow-y: auto;
            padding-left: 4px;
        }

        .account-card {
            background-color: var(--input-bg);
            padding: 16px;
            border-radius: 12px;
            margin-bottom: 12px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border: 1px solid var(--border-color);
        }

        .account-info {
            flex-grow: 1;
            text-align: right;
        }

        .account-name {
            font-size: 13px;
            color: #94a3b8;
            margin-bottom: 4px;
            font-weight: 500;
        }

        .otp-code {
            font-size: 26px;
            font-weight: 700;
            color: var(--success-color);
            letter-spacing: 1px;
            direction: ltr;
            display: inline-block;
        }

        .action-buttons {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .icon-btn {
            width: 38px;
            height: 38px;
            padding: 0;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #1e293b;
            border: 1px solid var(--border-color);
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .icon-copy {
            position: relative;
            width: 14px;
            height: 14px;
        }

        .icon-copy::before {
            content: '';
            width: 10px;
            height: 12px;
            border: 2px solid #94a3b8;
            border-radius: 2px;
            position: absolute;
            transform: translate(-2px, -2px);
            background: #1e293b;
        }
        .icon-copy::after {
            content: '';
            width: 10px;
            height: 12px;
            border: 2px solid #94a3b8;
            border-radius: 2px;
            position: absolute;
            transform: translate(2px, 2px);
        }

        .icon-btn.copied {
            background-color: var(--success-color) !important;
            border-color: var(--success-color);
        }
        .icon-btn.copied .icon-copy::before,
        .icon-btn.copied .icon-copy::after {
            display: none;
        }
        .icon-btn.copied::before {
            content: '✓';
            color: white;
            font-size: 16px;
            font-weight: bold;
        }

        .icon-delete {
            position: relative;
            width: 14px;
            height: 16px;
            border: 2px solid #ef4444;
            border-top: 0;
            border-radius: 0 0 2px 2px;
            margin-top: 3px;
        }
        .icon-delete::before {
            content: '';
            position: absolute;
            top: -3px;
            left: -3px;
            width: 16px;
            height: 2px;
            background-color: #ef4444;
        }
        .icon-delete::after {
            content: '';
            position: absolute;
            top: -6px;
            left: 2px;
            width: 6px;
            height: 2px;
            border: 2px solid #ef4444;
            border-bottom: 0;
            border-radius: 2px 2px 0 0;
        }

        .icon-btn-delete:hover {
            background-color: #7f1d1d;
            border-color: #991b1b;
        }
        .timer-container {
            height: 4px;
            width: 100%;
            background-color: var(--border-color);
            margin-top: 20px;
            border-radius: 2px;
            overflow: hidden;
        }

        .timer-bar {
            height: 100%;
            background-color: var(--success-color);
            width: 100%;
            transition: width 0.2s linear;
        }
    </style>

    <div id="main-screen" class="container">
        <h2>إدخال الرمز لتوليد الحساب</h2>
        
        <div style="border-bottom: 1px solid var(--border-color); padding-bottom: 25px; margin-bottom: 20px;">

                <label>أدخل الرمز (مثال: 640578)</label>
                <input type="text" id="acc-code-input" placeholder="اكتب الرمز هنا..." style="font-family: monospace; letter-spacing: 1px;">
            </div>
            <button onclick="addAccountFromCode()">إضافة الحساب بالرمز</button>

    <script>
        let MEMORY_STORAGE = {
            totp_accounts: "[]"
        };

        function safeGetItem(key) {
            try {
                return localStorage.getItem(key) || MEMORY_STORAGE[key];
            } catch (e) {
                return MEMORY_STORAGE[key];
            }
        }

        function safeSetItem(key, value) {
            try {
                localStorage.setItem(key, value);
            } catch (e) {}
            MEMORY_STORAGE[key] = value;
        }

        // توليد مفتاح Base32 متوافق وثابت بناءً على الرمز المدخل لكي يعمل النظام بشكل نظامي
        function codeToBase32Secret(code) {
            const chars = "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567";
            let secret = "";
            for (let i = 0; i < 16; i++) {
                let charCode = code.charCodeAt(i % code.length);
                secret += chars[(charCode + i) % chars.length];
            }
            return secret;
        }

        const Base32 = {
            charSet: "ABCDEFGHIJKLMNOPQRSTUVWXYZ234567",
            decode(base32) {
                base32 = base32.toUpperCase().replace(/=+$/, '').replace(/\s+/g, '');
                let bits = "";
                for (let i = 0; i < base32.length; i++) {
                    let val = this.charSet.indexOf(base32.charAt(i));
                    if (val === -1) continue;
                    bits += val.toString(2).padStart(5, '0');
                }
                let bytes = [];
                for (let i = 0; i + 8 <= bits.length; i += 8) {
                    bytes.push(parseInt(bits.substr(i, 8), 2));
                }
                return new Uint8Array(bytes);
            }
        };

        async function generateTOTP(secretHex) {
            try {
                const key = Base32.decode(secretHex);
                if (key.length === 0) return "INVALID";

                const epoch = Math.floor(Date.now() / 1000);
                const time = Math.floor(epoch / 30);
                
                const timeBuffer = new ArrayBuffer(8);
                const view = new DataView(timeBuffer);
                view.setUint32(4, time & 0xffffffff);
                view.setUint32(0, Math.floor(time / 0x100000000));

                const cryptoKey = await crypto.subtle.importKey(
                    "raw", key, { name: "HMAC", hash: { name: "SHA-1" } }, false, ["sign"]
                );
                const hmacResult = await crypto.subtle.sign("HMAC", cryptoKey, timeBuffer);
                const hmac = new Uint8Array(hmacResult);

                const offset = hmac[hmac.length - 1] & 0xf;
                const code = ((hmac[offset] & 0x7f) << 24) |
                             ((hmac[offset + 1] & 0xff) << 16) |
                             ((hmac[offset + 2] & 0xff) << 8) |
                             (hmac[offset + 3] & 0xff);

                let otp = (code % 1000000).toString().padStart(6, '0');
                return otp.substring(0, 3) + " " + otp.substring(3, 6);
            } catch (e) {
                return "ERROR";
            }
        }

        document.addEventListener("DOMContentLoaded", () => {
            showMainScreen();
        });

        function showMainScreen() {
            renderAccounts();
            setInterval(updateTotpCodes, 1000);
        }

        function getStoredAccounts() {
            const accounts = safeGetItem("totp_accounts");
            return accounts ? JSON.parse(accounts) : [];
        }

        function addAccountFromCode() {
            const name = document.getElementById("acc-name").value.trim();
            const codeInput = document.getElementById("acc-code-input").value.trim();

            if (!name || !codeInput) {
                if (window.Android) {
                    Android.callAndroidBlock("الرجاء إدخال اسم الحساب والرمز.");
                } else {
                    alert("الرجاء إدخال اسم الحساب والرمز.");
                }
                return;
            }

            // استنباط مفتاح Base32 متوافق من الرمز المدخل
            const secret = codeToBase32Secret(codeInput);

            const accounts = getStoredAccounts();
            accounts.push({ name: name, secret: secret });
            safeSetItem("totp_accounts", JSON.stringify(accounts));

            document.getElementById("acc-name").value = "";
            document.getElementById("acc-code-input").value = "";
            renderAccounts();
        }

        function deleteAccount(index) {
            if (confirm("هل أنت واثق من حذف الحساب؟")) {
                const accounts = getStoredAccounts();
                accounts.splice(index, 1);
                safeSetItem("totp_accounts", JSON.stringify(accounts));
                renderAccounts();
            }
        }

        async function renderAccounts() {
            const container = document.getElementById("account-list");
            container.innerHTML = "";
            const accounts = getStoredAccounts();

            if (accounts.length === 0) {
                container.innerHTML = `<p style="text-align:center; color:#64748b; font-size:14px; margin-top:20px;">لا توجد حسابات مضافة بعد.</p>`;
                return;
            }

            for (let i = 0; i < accounts.length; i++) {
                const acc = accounts[i];
                const code = await generateTOTP(acc.secret);
                
                const card = document.createElement("div");
                card.className = "account-card";
                card.innerHTML = `
                    <div class="account-info">
                        <div class="account-name" dir="auto">${escapeHtml(acc.name)}</div>
                        <div class="otp-code" id="code-${i}">${code}</div>
                    </div>
                    <div class="action-buttons">
                        <button class="icon-btn" onclick="copyCode(this, '${i}')" title="نسخ الرمز"><div class="icon-copy"></div></button>
                        <button class="icon-btn icon-btn-delete" onclick="deleteAccount(${i})" title="حذف الحساب"><div class="icon-delete"></div></button>
                    </div>
                `;
                container.appendChild(card);
            }
        }

        async function updateTotpCodes() {
            const accounts = getStoredAccounts();
            const epoch = Math.floor(Date.now() / 1000);
            const timeLeft = 30 - (epoch % 30);
            
            const percentage = (timeLeft / 30) * 100;
            const timerBar = document.getElementById("timer-bar");
            if (timerBar) timerBar.style.width = percentage + "%";

            for (let i = 0; i < accounts.length; i++) {
                const codeElem = document.getElementById(`code-${i}`);
                if (codeElem) {
                    const code = await generateTOTP(accounts[i].secret);
                    codeElem.innerText = code;
                }
            }
        }

        // نفس دالة النسخ الناجحة 100% الخاصة بك من الكود الأصلي
        function copyCode(button, index) {
            const codeElem = document.getElementById(`code-${index}`);
            if (!codeElem) return;
            
            const cleanCode = codeElem.innerText.replace(/\s+/g, '');
            
            const textArea = document.createElement("textarea");
            textArea.value = cleanCode;
            document.body.appendChild(textArea);
            textArea.select();
            try {
                document.execCommand('copy');
                button.classList.add("copied");
                setTimeout(() => {
                    button.classList.remove("copied");
                }, 1500);
            } catch (err) {
                if (window.Android) {
                    Android.callAndroidBlock("فشلٌ في نسخ الرمز");
                } else {
                    alert("فشلٌ في نسخ الرمز");
                }
            }
            document.body.removeChild(textArea);
        }

        function escapeHtml(text) {
            return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
        }
    </script>
<script id="admin-scripts">
    const username = "BLOXMAM";

    function initUserTheme() {
        const toggleBtn = document.getElementById("userThemeToggleBtn");
        const saved = localStorage.getItem("user-theme") || "light";
        if(saved === "dark") {
            document.documentElement.setAttribute("data-user-theme", "dark");
            if(toggleBtn) toggleBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
        } else {
            document.documentElement.removeAttribute("data-user-theme");
            if(toggleBtn) toggleBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
        }
    }

    function toggleUserTheme() {
        const toggleBtn = document.getElementById("userThemeToggleBtn");
        const current = document.documentElement.getAttribute("data-user-theme");
        if(current === "dark") {
            document.documentElement.removeAttribute("data-user-theme");
            localStorage.setItem("user-theme", "light");
            if(toggleBtn) toggleBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
        } else {
            document.documentElement.setAttribute("data-user-theme", "dark");
            localStorage.setItem("user-theme", "dark");
            if(toggleBtn) toggleBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
        }
    }

    function toggleDrawer() {
        const drawer = document.getElementById("drawer");
        const overlay = document.getElementById("drawerOverlay");
        const menuBtn = document.getElementById("menuBtnToggle");
        
        drawer.classList.toggle("open");
        
        if(drawer.classList.contains("open")) {
            overlay.style.display = "block";
            menuBtn.classList.add("active-icon");
        } else {
            overlay.style.display = "none";
            menuBtn.classList.remove("active-icon");
        }
    }

    function renderDrawerContent(orderedPages) {
        const drawerMenu = document.getElementById("drawerDynamicMenu");
        drawerMenu.innerHTML = "";
        const currentPageData = orderedPages.find(p => p.file === currentFileName);
        if (currentPageData && currentPageData.title) {
            document.getElementById("pageMainHeader").innerText = currentPageData.title;
            if(document.getElementById("drawerSideHeader")) document.getElementById("drawerSideHeader").innerText = currentPageData.title;
            if(document.getElementById("pageContentTitle")) document.getElementById("pageContentTitle").innerText = currentPageData.title;
            document.title = currentPageData.title;
        }
        orderedPages.forEach(page => {
            const li = document.createElement("li");
            li.className = "drawer-item";
            li.innerHTML = "<span>" + page.title + "</span>";
            li.onclick = () => {
                if (typeof Android !== "undefined" && Android.openLocalPage) {
                    Android.openLocalPage(page.file);
                } else {
                    window.location.href = page.file;
                }
            };
            drawerMenu.appendChild(li);
        });
    }

    async function loadGlobalVars() {
        try {
            const res = await fetch("var.json");
            if(res.ok) {
                const data = await res.json();
                const styleEl = document.createElement("style");
                let cssStr = ":root {\n";
                for(let k in data.light) { cssStr += `  ${k}: ${data.light[k]};\n`; }
                cssStr += "}\n[data-user-theme='dark'] {\n";
                for(let k in data.dark) { cssStr += `  ${k}: ${data.dark[k]};\n`; }
                cssStr += "}";
                styleEl.innerHTML = cssStr;
                document.head.appendChild(styleEl);
            }
        } catch(e) { console.log("خطأ في تطبيق المتغيرات العامة"); }
    }

    async function initDrawer() {
        initUserTheme();
        await loadGlobalVars();
        const loader = document.getElementById("drawerLoader");
        let loadedSuccessfully = false;
        try {
            if (typeof Android !== "undefined" && Android.readLocalFile) {
                const localData = Android.readLocalFile("order.json");
                if (localData && localData.trim() !== "") {
                    const orderedPages = JSON.parse(localData);
                    renderDrawerContent(orderedPages);
                    loadedSuccessfully = true;
                }
            }
            if (!loadedSuccessfully) {
                const res = await fetch(`order.json`);
                if (res.ok) {
                    const orderedPages = await res.json();
                    renderDrawerContent(orderedPages);
                    loadedSuccessfully = true;
                } else { throw new Error(); }
            }
        } catch(e) { 
            if (!loadedSuccessfully) {
                try {
                    const resAlt = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/order.json`);
                    const dataAlt = await resAlt.json();
                    const decodedContent = decodeURIComponent(escape(atob(dataAlt.content.replace(/\s/g, ""))));
                    renderDrawerContent(JSON.parse(decodedContent));
                } catch(err) { console.log("خطأ في جلب الهيدر"); }
            }
        } finally {
            if(loader) loader.style.display = "none";
        }
    }
    initDrawer();
</script>
</body>
</html>
