<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إدارة الديون الشاملة</title>
    <style>
        /* سيتم إدراج متغيرات الألوان هنا حسب الطلب (افتراضياً الوضع الفاتح) */
        :root {
            --bg-color: #f8f9fa;
            --card-bg: #ffffff;
            --text-color: #212529;
            --text-muted: #6c757d;
            --primary-color: #4f46e5;
            --primary-hover: #4338ca;
            --danger-color: #ef4444;
            --danger-hover: #dc2626;
            --warning-color: #f59e0b;
            --warning-hover: #d97706;
            --border-color: #e5e7eb;
            --input-bg: #ffffff;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -1px rgba(0, 0, 0, 0.03);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            padding: 12px;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 100%;
            margin: 0 auto;
        }

        /* لوحة الإحصائيات المدمجة بدلاً من الهيدر */
        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
            margin-bottom: 15px;
        }

        .stat-card {
            background: var(--card-bg);
            padding: 12px 15px;
            border-radius: 10px;
            border: 1px solid var(--border-color);
            box-shadow: var(--shadow);
            text-align: center;
        }

        .stat-card span {
            display: block;
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }

        .stat-card strong {
            font-size: 16px;
            color: var(--primary-color);
        }

        /* شريط التحكم (بحث + زر الإضافة) */
        .actions-bar {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
            flex-direction: column;
        }

        @media (min-width: 600px) {
            .actions-bar {
                flex-direction: row;
                justify-content: space-between;
            }
        }

        .search-box {
            flex: 1;
            padding: 12px 15px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-color);
            font-size: 14px;
            outline: none;
            box-shadow: var(--shadow);
        }

        .btn {
            padding: 12px 20px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            font-size: 14px;
            transition: background 0.2s, transform 0.1s;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 5px;
            box-shadow: var(--shadow);
        }

        .btn:active {
            transform: scale(0.98);
        }

        .btn-primary {
            background-color: var(--primary-color);
            color: white;
        }

        .btn-primary:hover {
            background-color: var(--primary-hover);
        }

        .btn-danger {
            background-color: var(--danger-color);
            color: white;
        }

        .btn-danger:hover {
            background-color: var(--danger-hover);
        }

        .btn-warning {
            background-color: var(--warning-color);
            color: white;
        }

        .btn-warning:hover {
            background-color: var(--warning-hover);
        }

        /* تصميم متجاوب للجدول / البطاقات للشاشات الصغيرة */
        .content-area {
            background: var(--card-bg);
            border-radius: 12px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            overflow: hidden;
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: right;
            white-space: nowrap;
        }

        th, td {
            padding: 12px 15px;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            background-color: var(--bg-color);
            color: var(--text-muted);
            font-size: 13px;
            font-weight: 600;
        }

        td {
            font-size: 14px;
        }

        tr:last-child td {
            border-bottom: none;
        }

        .badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 20px;
            font-size: 11px;
            font-weight: 600;
        }

        .badge-paid {
            background-color: rgba(16, 185, 129, 0.1);
            color: #10b981;
        }

        .badge-unpaid {
            background-color: rgba(239, 68, 68, 0.1);
            color: var(--danger-color);
        }

        .actions-btns {
            display: flex;
            gap: 6px;
        }

        .actions-btns button {
            padding: 5px 10px;
            font-size: 11px;
            border-radius: 6px;
        }

        /* Modal Styles (نافذة الإضافة والتعديل المنبثقة) */
        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            justify-content: center;
            align-items: center;
            z-index: 1000;
            padding: 15px;
        }

        .modal-content {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 14px;
            width: 100%;
            max-width: 450px;
            box-shadow: var(--shadow);
            position: relative;
            animation: fadeIn 0.2s ease-in-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .modal-content h2 {
            margin-bottom: 15px;
            font-size: 18px;
            color: var(--primary-color);
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 13px;
            color: var(--text-muted);
        }

        .form-group input, .form-group select {
            width: 100%;
            padding: 10px 12px;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            font-size: 14px;
            outline: none;
        }

        .modal-actions {
            display: flex;
            justify-content: flex-end;
            gap: 8px;
            margin-top: 15px;
        }

        .empty-state {
            text-align: center;
            padding: 30px;
            color: var(--text-muted);
            font-size: 14px;
        }
    </style>

    <div class="container">
        <!-- لوحة الإحصائيات العلوية (متجاوبة) -->
        <div class="stats-grid">
            <div class="stat-card">
                <span>إجمالي الديون</span>
                <strong id="totalDebt">0.00 ر.س</strong>
            </div>
            <div class="stat-card">
                <span>عدد المدينين</span>
                <strong id="totalClients">0</strong>
            </div>
        </div>

        <!-- شريط البحث وزر الإضافة -->
        <div class="actions-bar">
            <input type="text" id="searchInput" class="search-box" placeholder="ابحث باسم الشخص أو الفاتورة..." oninput="filterDebts()">
            <button class="btn btn-primary" onclick="openModal()">+ إضافة مديون</button>
        </div>

        <!-- جدول البيانات -->
        <div class="content-area">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>إسم الشخص / الفاتورة</th>
                            <th>البضاعة</th>
                            <th>الدين المسجل</th>
                            <th>الحالة</th>
                            <th>التاريخ</th>
                            <th>الإجراءات</th>
                        </tr>
                    </thead>
                    <tbody id="debtsTableBody">
                        <!-- البيانات تضاف ديناميكياً -->
                    </tbody>
                </table>
            </div>
            <div id="emptyState" class="empty-state" style="display: none;">لا توجد أي ديون مسجلة حالياً.</div>
        </div>
    </div>

    <!-- نافذة إضافة / تعديل مديون -->
    <div class="modal" id="debtModal">
        <div class="modal-content">
            <h2 id="modalTitle">إضافة مديون جديد</h2>
            <form id="debtForm" onsubmit="saveDebt(event)">
                <input type="hidden" id="debtId">
                <div class="form-group">
                    <label for="clientName">إسم الشخص / الفاتورة</label>
                    <input type="text" id="clientName" required placeholder="أدخل اسم الشخص أو رقم الفاتورة">
                </div>
                <div class="form-group">
                    <label for="goods">البضاعة</label>
                    <input type="text" id="goods" required placeholder="نوع البضاعة أو التفاصيل">
                </div>
                <div class="form-group">
                    <label for="amount">الدين المسجل (ر.س)</label>
                    <input type="number" step="0.01" id="amount" required placeholder="المبلغ">
                </div>
                <div class="form-group">
                    <label for="status">حالة السداد</label>
                    <select id="status">
                        <option value="غير مسدد">غير مسدد</option>
                        <option value="مسدد">مسدد</option>
                    </select>
                </div>
                <div class="modal-actions">
                    <button type="button" class="btn" style="background: var(--border-color); color: var(--text-color);" onclick="closeModal()">إلغاء</button>
                    <button type="submit" class="btn btn-primary">حفظ</button>
                </div>
            </form>
        </div>
    </div>

    <script>
        let debts = JSON.parse(localStorage.getItem('debts')) || [];

        function renderTable(data = debts) {
            const tbody = document.getElementById('debtsTableBody');
            const emptyState = document.getElementById('emptyState');
            tbody.innerHTML = '';

            if (data.length === 0) {
                emptyState.style.display = 'block';
            } else {
                emptyState.style.display = 'none';
                data.forEach((debt) => {
                    const row = document.createElement('tr');
                    row.innerHTML = `
                        <td><strong>${debt.clientName}</strong></td>
                        <td>${debt.goods}</td>
                        <td>${parseFloat(debt.amount).toFixed(2)} ر.س</td>
                        <td><span class="badge ${debt.status === 'مسدد' ? 'badge-paid' : 'badge-unpaid'}">${debt.status}</span></td>
                        <td>${debt.date}</td>
                        <td>
                            <div class="actions-btns">
                                <button class="btn btn-warning" onclick="editDebt(${debt.id})">تعديل</button>
                                <button class="btn btn-danger" onclick="deleteDebt(${debt.id})">حذف</button>
                            </div>
                        </td>
                    `;
                    tbody.appendChild(row);
                });
            }
            updateStats();
        }

        function updateStats() {
            const total = debts.reduce((sum, debt) => sum + (debt.status === 'غير مسدد' ? parseFloat(debt.amount) : 0), 0);
            document.getElementById('totalDebt').innerText = total.toFixed(2) + ' ر.س';
            document.getElementById('totalClients').innerText = debts.length;
        }

        function openModal(editId = null) {
            const modal = document.getElementById('debtModal');
            const modalTitle = document.getElementById('modalTitle');
            document.getElementById('debtForm').reset();
            document.getElementById('debtId').value = '';

            if (editId) {
                modalTitle.innerText = 'تعديل بيانات الدين';
                const debt = debts.find(d => d.id === editId);
                if (debt) {
                    document.getElementById('debtId').value = debt.id;
                    document.getElementById('clientName').value = debt.clientName;
                    document.getElementById('goods').value = debt.goods;
                    document.getElementById('amount').value = debt.amount;
                    document.getElementById('status').value = debt.status;
                }
            } else {
                modalTitle.innerText = 'إضافة مديون جديد';
            }
            modal.style.display = 'flex';
        }

        function closeModal() {
            document.getElementById('debtModal').style.display = 'none';
        }

        function saveDebt(event) {
            event.preventDefault();
            const id = document.getElementById('debtId').value;
            const clientName = document.getElementById('clientName').value;
            const goods = document.getElementById('goods').value;
            const amount = document.getElementById('amount').value;
            const status = document.getElementById('status').value;
            const date = new Date().toLocaleDateString('ar-SA');

            if (id) {
                const index = debts.findIndex(d => d.id == id);
                if (index !== -1) {
                    debts[index] = { id: parseInt(id), clientName, goods, amount, status, date };
                }
            } else {
                const newDebt = {
                    id: Date.now(),
                    clientName,
                    goods,
                    amount,
                    status,
                    date
                };
                debts.push(newDebt);
            }

            localStorage.setItem('debts', JSON.stringify(debts));
            closeModal();
            renderTable();
        }

        function editDebt(id) {
            openModal(id);
        }

        function deleteDebt(id) {
            if (confirm('هل أنت متأكد من حذف هذا السجل؟')) {
                debts = debts.filter(d => d.id !== id);
                localStorage.setItem('debts', JSON.stringify(debts));
                renderTable();
            }
        }

        function filterDebts() {
            const query = document.getElementById('searchInput').value.toLowerCase();
            const filtered = debts.filter(d => 
                d.clientName.toLowerCase().includes(query) || 
                d.goods.toLowerCase().includes(query)
            );
            renderTable(filtered);
        }

        window.onload = function() {
            renderTable();
        };
    </script>
<script id="admin-scripts">
    const username = "BLOXMAM";
    const repo = "TOTP";
    const currentFileName = "wowbox.html";

    function initUserTheme() {
        const toggleBtn = document.getElementById("userThemeToggleBtn");
        const saved = localStorage.getItem("user-theme") || "light";
        if(saved === "dark") {
            document.documentElement.setAttribute("data-user-theme", "dark");
            if(toggleBtn) toggleBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
        } else {
            document.documentElement.removeAttribute("data-user-theme");
            if(toggleBtn) toggleBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
        }
    }

    function toggleUserTheme() {
        const toggleBtn = document.getElementById("userThemeToggleBtn");
        const current = document.documentElement.getAttribute("data-user-theme");
        if(current === "dark") {
            document.documentElement.removeAttribute("data-user-theme");
            localStorage.setItem("user-theme", "light");
            if(toggleBtn) toggleBtn.innerHTML = '<i class="fa-solid fa-moon"></i>';
        } else {
            document.documentElement.setAttribute("data-user-theme", "dark");
            localStorage.setItem("user-theme", "dark");
            if(toggleBtn) toggleBtn.innerHTML = '<i class="fa-solid fa-sun"></i>';
        }
    }

    function toggleDrawer() {
        const drawer = document.getElementById("drawer");
        const overlay = document.getElementById("drawerOverlay");
        const menuBtn = document.getElementById("menuBtnToggle");
        
        drawer.classList.toggle("open");
        
        if(drawer.classList.contains("open")) {
            overlay.style.display = "block";
            menuBtn.classList.add("active-icon");
        } else {
            overlay.style.display = "none";
            menuBtn.classList.remove("active-icon");
        }
    }

    function renderDrawerContent(orderedPages) {
        const drawerMenu = document.getElementById("drawerDynamicMenu");
        drawerMenu.innerHTML = "";
        const currentPageData = orderedPages.find(p => p.file === currentFileName);
        if (currentPageData && currentPageData.title) {
            document.getElementById("pageMainHeader").innerText = currentPageData.title;
            if(document.getElementById("drawerSideHeader")) document.getElementById("drawerSideHeader").innerText = currentPageData.title;
            if(document.getElementById("pageContentTitle")) document.getElementById("pageContentTitle").innerText = currentPageData.title;
            document.title = currentPageData.title;
        }
        orderedPages.forEach(page => {
            const li = document.createElement("li");
            li.className = "drawer-item";
            li.innerHTML = "<span>" + page.title + "</span>";
            li.onclick = () => {
                if (typeof Android !== "undefined" && Android.openLocalPage) {
                    Android.openLocalPage(page.file);
                } else {
                    window.location.href = page.file;
                }
            };
            drawerMenu.appendChild(li);
        });
    }

    async function loadGlobalVars() {
        try {
            const res = await fetch("var.json");
            if(res.ok) {
                const data = await res.json();
                const styleEl = document.createElement("style");
                let cssStr = ":root {\n";
                for(let k in data.light) { cssStr += `  ${k}: ${data.light[k]};\n`; }
                cssStr += "}\n[data-user-theme='dark'] {\n";
                for(let k in data.dark) { cssStr += `  ${k}: ${data.dark[k]};\n`; }
                cssStr += "}";
                styleEl.innerHTML = cssStr;
                document.head.appendChild(styleEl);
            }
        } catch(e) { console.log("خطأ في تطبيق المتغيرات العامة"); }
    }

    async function initDrawer() {
        initUserTheme();
        await loadGlobalVars();
        const loader = document.getElementById("drawerLoader");
        let loadedSuccessfully = false;
        try {
            if (typeof Android !== "undefined" && Android.readLocalFile) {
                const localData = Android.readLocalFile("order.json");
                if (localData && localData.trim() !== "") {
                    const orderedPages = JSON.parse(localData);
                    renderDrawerContent(orderedPages);
                    loadedSuccessfully = true;
                }
            }
            if (!loadedSuccessfully) {
                const res = await fetch(`order.json`);
                if (res.ok) {
                    const orderedPages = await res.json();
                    renderDrawerContent(orderedPages);
                    loadedSuccessfully = true;
                } else { throw new Error(); }
            }
        } catch(e) { 
            if (!loadedSuccessfully) {
                try {
                    const resAlt = await fetch(`https://api.github.com/repos/${username}/${repo}/contents/order.json`);
                    const dataAlt = await resAlt.json();
                    const decodedContent = decodeURIComponent(escape(atob(dataAlt.content.replace(/\s/g, ""))));
                    renderDrawerContent(JSON.parse(decodedContent));
                } catch(err) { console.log("خطأ في جلب الهيدر"); }
            }
        } finally {
            if(loader) loader.style.display = "none";
        }
    }
    initDrawer();
</script>
</body>
</html>
