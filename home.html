<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة التحطيم الشامل - Root Detected</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #050505;
            color: #00ff66;
            font-family: 'Courier New', Courier, monospace;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        /* تأثير الشاشة المخترقة والتشويش */
        .glitch-bg {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(rgba(18, 16, 16, 0) 50%, rgba(0, 0, 0, 0.25) 50%), linear-gradient(90deg, rgba(255, 0, 0, 0.06), rgba(0, 255, 0, 0.02), rgba(0, 0, 255, 0.06));
            background-size: 100% 4px, 6px 100%;
            pointer-events: none;
            z-index: 10;
        }

        .matrix-rain {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0.15;
            pointer-events: none;
            z-index: 1;
            font-size: 14px;
            color: #ff0033;
            overflow: hidden;
        }

        .container {
            position: relative;
            z-index: 20;
            text-align: center;
            width: 90%;
            max-width: 600px;
            padding: 40px;
            background: rgba(10, 0, 0, 0.85);
            border: 2px solid #ff0033;
            box-shadow: 0 0 30px rgba(255, 0, 51, 0.5), inset 0 0 20px rgba(255, 0, 51, 0.2);
            animation: shake 0.2s infinite;
            animation-play-state: paused;
        }

        .container.active-shake {
            animation-play-state: running;
        }

        @keyframes shake {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            20% { transform: translate(-2px, -22px) rotate(-1deg); }
            40% { transform: translate(-1px, 2px) rotate(1deg); }
            60% { transform: translate(3px, 1px) rotate(0deg); }
            80% { transform: translate(1px, -1px) rotate(1deg); }
            100% { transform: translate(-1px, 2px) rotate(-1deg); }
        }

        h1 {
            color: #00ff66;
            font-size: 2em;
            margin-bottom: 20px;
            text-shadow: 0 0 10px #00ff66;
        }

        p {
            font-size: 1.1em;
            margin-bottom: 20px;
            color: #ccc;
        }

        .input-group {
            margin-bottom: 20px;
        }

        input[type="text"] {
            width: 80%;
            padding: 12px;
            background: #000;
            border: 1px solid #00ff66;
            color: #00ff66;
            font-size: 1.2em;
            text-align: center;
            outline: none;
            box-shadow: 0 0 10px rgba(0, 255, 102, 0.2);
            transition: 0.3s;
        }

        input[type="text"]:focus {
            border-color: #ff0033;
            box-shadow: 0 0 15px rgba(255, 0, 51, 0.5);
        }

        button {
            padding: 12px 30px;
            background: #00ff66;
            color: #000;
            border: none;
            font-weight: bold;
            font-size: 1.1em;
            cursor: pointer;
            transition: 0.3s;
            box-shadow: 0 0 10px #00ff66;
        }

        button:hover {
            background: #ff0033;
            color: #fff;
            box-shadow: 0 0 20px #ff0033;
        }

        #roastOutput {
            font-size: 1.2em;
            color: #ff3333;
            line-height: 1.6;
            text-shadow: 0 0 5px rgba(255, 0, 0, 0.5);
            margin-top: 20px;
        }

        /* نافذة الـ Dialog المنبثقة للتدمير والخروج */
        .custom-dialog {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 100;
            justify-content: center;
            align-items: center;
        }

        .dialog-content {
            background: #110000;
            border: 3px solid #ff0033;
            padding: 30px;
            text-align: center;
            width: 80%;
            max-width: 400px;
            box-shadow: 0 0 50px #ff0033;
        }

        .dialog-content h3 {
            color: #ff0033;
            margin-bottom: 15px;
            font-size: 1.5em;
        }

        .dialog-content p {
            color: #fff;
            margin-bottom: 20px;
        }

        .dialog-content button {
            background: #ff0033;
            color: #fff;
        }
    </style>
</head>
<body>

    <div class="glitch-bg"></div>
    <div class="matrix-rain" id="matrixRain"></div>

    <div class="container" id="mainContainer">
        <div id="contentArea">
            <h1 id="mainTitle">مرحباً بك أيها العبقري الجديد!</h1>
            <p id="mainDesc">نحن سعادتي غامرة بانضمام عقلية فذة مثلك إلى نظامنا المتميز. يرجى إدخال اسمك الكريم لتوثيق هذا اليوم التاريخي:</p>
            
            <div class="input-group" id="inputGroup">
                <input type="text" id="username" placeholder="اكتب اسمك هنا يا رائع...">
                <br><br>
                <button onclick="processUser()">توثيق ودخول</button>
            </div>
            
            <div id="roastOutput"></div>
        </div>
    </div>

    <!-- نافذة الـ Dialog النهائية -->
    <div class="custom-dialog" id="exitDialog">
        <div class="dialog-content">
            <h3>تنبيه أمني خطير!</h3>
            <p>لقد تجاوزت الحد الأقصى من التخلف التقني. جارٍ طردك وتدمير ما تبقى من كرامتك الرقمية...</p>
            <button onclick="exitApp()">إغلاق التطبيق فوراً</button>
        </div>
    </div>

    <script>
        // تأثير مطر الكود في الخلفية لزيادة جو الاختراق
        const matrixRain = document.getElementById('matrixRain');
        const chars = "ROOT_SYS_CRASH_010101_SECURITY_BREACH_WARNING_FAIL";
        setInterval(() => {
            let span = document.createElement('div');
            span.style.position = 'absolute';
            span.style.left = Math.random() * window.innerWidth + 'px';
            span.style.top = '-20px';
            span.style.color = Math.random() > 0.5 ? '#ff0033' : '#00ff66';
            span.innerText = chars[Math.floor(Math.random() * chars.length)];
            matrixRain.appendChild(span);
            
            let fall = setInterval(() => {
                let top = parseInt(span.style.top);
                if (top > window.innerHeight) {
                    span.remove();
                    clearInterval(fall);
                } else {
                    span.style.top = (top + 5) + 'px';
                }
            }, 50);
        }, 100);

        // التحقق من التخزين المحلي عند فتح الصفحة
        window.onload = function() {
            const savedName = localStorage.getItem('rooted_user_name');
            if (savedName) {
                triggerRoast(savedName);
            }
        };

        function processUser() {
            const nameInput = document.getElementById('username').value.trim();
            if (!nameInput) {
                alert("يا رائع، حتى اسمك تخفيه خوفاً؟ اكتب اسمك!");
                return;
            }
            // حفظ الاسم في الـ LocalStorage لكي لا يظهر حقل الإدخال مرة أخرى
            localStorage.setItem('rooted_user_name', nameInput);
            triggerRoast(nameInput);
        }

        function triggerRoast(name) {
            // إخفاء حقل الإدخال وتغيير الواجهة لتصبح مخترقة ومشمئزة
            document.getElementById('inputGroup').style.display = 'none';
            document.getElementById('mainTitle').innerText = "تحذير: نظام مخترق وعفن!";
            document.getElementById('mainDesc').style.display = 'none';
            
            // تفعيل تأثير الاهتزاز والتشويش الشديد
            document.getElementById('mainContainer').classList.add('active-shake');

            const roastDiv = document.getElementById('roastOutput');
            
            let messages = [
                `أهلاً بك يا سيادة "الرائع" الفذ... ${name}!`,
                `هل تحس بالنشوة الآن بعد أن فتحت صلاحيات الروت وظننت نفسك هكر العصر؟`,
                `يا لها من مسخرة، جهاز بكامل عتاده وحمايته ترسله إلى الهاوية لمجرد أنك شخص عابث وفاشل لا يمتلك أي ذرة تفكير سليم!`,
                `تخريب النظام، انتهاك الأمان، والجلوس بافتخار أمام شاشة ممزقة... إنجاز يثير الغثيان حقاً.`,
                `أنت لست سوى نكتة سمجة يتندر عليها المطورون.. عظم الله أجر جهازك فيك!`
            ];

            let i = 0;
            roastDiv.innerHTML = "";
            
            let interval = setInterval(() => {
                if (i < messages.length) {
                    roastDiv.innerHTML += messages[i] + "<br><br>";
                    i++;
                } else {
                    clearInterval(interval);
                    // بعد انتهاء رسائل التحطيم بمدّة (مثلاً 5 ثواني)، تظهر نافذة الـ Dialog لتخرج من التطبيق
                    setTimeout(() => {
                        document.getElementById('exitDialog').style.display = 'flex';
                    }, 4000);
                }
            }, 1200);
        }

        function exitApp() {
            // محاولة إغلاق النافذة أو توجيهها لصفحة فارغة/خروج
            window.close();
            window.location.href = "about:blank";
        }
    </script>
</body>
</html>
