<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منظومة التحطيم الشامل - Root Detected</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #030303;
            color: #ff3366;
            font-family: 'Cairo', sans-serif;
            height: 100vh;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
        }

        .cyber-grid {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: linear-gradient(rgba(255, 0, 51, 0.03) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(255, 0, 51, 0.03) 1px, transparent 1px);
            background-size: 30px 30px;
            z-index: 1;
            pointer-events: none;
        }

        .ambient-glow {
            position: absolute;
            width: 500px;
            height: 500px;
            background: radial-gradient(circle, rgba(255, 0, 51, 0.15) 0%, rgba(0, 0, 0, 0) 70%);
            z-index: 2;
            pointer-events: none;
            animation: pulseGlow 4s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.5; }
            50% { transform: scale(1.2); opacity: 0.8; }
        }

        .container {
            position: relative;
            z-index: 10;
            text-align: center;
            width: 90%;
            max-width: 550px;
            padding: 45px 30px;
            background: rgba(12, 12, 15, 0.9);
            border: 1px solid rgba(255, 51, 102, 0.3);
            border-radius: 20px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.8), 0 0 30px rgba(255, 51, 102, 0.1);
            backdrop-filter: blur(10px);
        }

        h1 {
            color: #fff;
            font-size: 1.8em;
            font-weight: 900;
            margin-bottom: 15px;
            letter-spacing: -0.5px;
        }

        h1 span {
            color: #ff3366;
            text-shadow: 0 0 15px rgba(255, 51, 102, 0.5);
        }

        p {
            font-size: 1.05em;
            margin-bottom: 25px;
            color: #8a8a93;
            line-height: 1.6;
        }

        .action-group {
            display: flex;
            flex-direction: column;
            gap: 15px;
            align-items: center;
            margin-top: 20px;
        }

        button {
            padding: 14px 35px;
            background: linear-gradient(135deg, #ff3366, #ff0033);
            color: #fff;
            border: none;
            font-weight: 700;
            font-size: 1.1em;
            font-family: 'Cairo', sans-serif;
            cursor: pointer;
            border-radius: 12px;
            transition: all 0.3s ease;
            box-shadow: 0 5px 20px rgba(255, 51, 102, 0.4);
            width: 100%;
            max-width: 380px;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 51, 102, 0.6);
        }

        #roastOutput {
            font-size: 1.15em;
            color: #ff6685;
            line-height: 1.8;
            margin-top: 15px;
            text-align: right;
            padding: 0 10px;
        }

        dialog.cyber-dialog {
            background: rgba(15, 15, 20, 0.95);
            color: #fff;
            border: 2px solid #ff3366;
            border-radius: 20px;
            padding: 35px;
            width: 90%;
            max-width: 420px;
            text-align: center;
            box-shadow: 0 0 50px rgba(255, 51, 102, 0.4);
            backdrop-filter: blur(15px);
            margin: auto;
            animation: dialogPop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        dialog.cyber-dialog::backdrop {
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
        }

        @keyframes dialogPop {
            0% { transform: scale(0.7); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }

        .cyber-dialog h3 {
            color: #ff3366;
            font-size: 1.6em;
            margin-bottom: 15px;
        }

        .cyber-dialog p {
            color: #b0b0bc;
            margin-bottom: 25px;
            font-size: 1.1em;
        }

        .cyber-dialog button {
            background: #ff3366;
            box-shadow: 0 5px 15px rgba(255, 51, 102, 0.4);
        }
    </style>
</head>
<body>
<!-- START PASSWORD PROTECTION -->
<style id="page-lock-style">
    * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        font-family: 'Tajawal', sans-serif;
    }
    html, body { overflow: hidden !important; width: 100% !important; height: 100% !important; margin: 0 !important; padding: 0 !important; }
    #page-lock-screen-protection {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: #f4f6f9; color: #2c3e50; z-index: 9999999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        font-family: system-ui, -apple-system, sans-serif; padding: 20px; box-sizing: border-box;
        text-align: center;
    }
    #page-lock-screen-protection .lock-card {
        background: #ffffff; padding: 35px 25px; border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.06); max-width: 360px; width: 100%;
        border: 1px solid #e1e8ed;
    }
    #page-lock-screen-protection .lock-icon {
        font-size: 42px; margin-bottom: 15px; color: #34495e;
    }
    #page-lock-screen-protection h2 {
        margin: 0 0 10px 0; font-size: 1.3rem; color: #2c3e50; font-weight: 700;
    }
    #page-lock-screen-protection p {
        margin: 0 0 20px 0; font-size: 0.95rem; color: #7f8c8d; line-height: 1.5;
    }
    #page-lock-screen-protection input {
        width: 100%; padding: 12px 15px; border: 1.5px solid #dcdde1;
        border-radius: 10px; font-size: 1rem; outline: none; margin-bottom: 15px;
        box-sizing: border-box; text-align: center; transition: border-color 0.2s;
    }
    #page-lock-screen-protection input:focus {
        border-color: #18bc9c;
    }
    #page-lock-screen-protection button {
        width: 100%; background: #18bc9c; color: white; border: none;
        padding: 12px; border-radius: 10px; font-size: 1rem; font-weight: bold;
        cursor: pointer; transition: background 0.2s;
    }
    #page-lock-screen-protection button:active {
        transform: scale(0.98);
    }
    #page-lock-error-msg {
        color: #e74c3c; font-size: 0.85rem; margin-top: 10px; display: none;
    }
</style>
<div id="page-lock-screen-protection">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;900&display=swap" rel="stylesheet">
    <div class="lock-card">
        <div class="lock-icon"><i class="fa-solid fa-lock"></i></div>
        <h2>هذه صفحة خاصة!</h2>
        <p>يرجى إدخال كلمة المرور لتستطيع رؤيتها!</p>
        <input type="password" id="page-lock-pass-input" placeholder="كلمة المرور">
        <button onclick="verifyPagePassword()">دخول</button>
        <div id="page-lock-error-msg">كلمة المرور غير صحيحة!</div>
    </div>
</div>
<script>
    const PAGE_PASSWORD = "11";
    function verifyPagePassword() {
        const inputVal = document.getElementById("page-lock-pass-input").value;
        const errorEl = document.getElementById("page-lock-error-msg");
        if(PAGE_PASSWORD !== "" && inputVal === PAGE_PASSWORD) {
            document.getElementById("page-lock-screen-protection").remove();
            const lockStyle = document.getElementById("page-lock-style");
            if(lockStyle) lockStyle.remove();
        } else {
            errorEl.style.display = "block";
        }
    }
</script>
<!-- END PASSWORD PROTECTION -->


    <div class="cyber-grid"></div>
    <div class="ambient-glow"></div>

    <div class="container" id="mainContainer">
        <div id="contentArea">
            <h1 id="mainTitle">تم <span>حظرك!</span></h1>
            <p id="mainDesc">عذراً، لقد تم حظرك نهائياً من استخدام التطبيق نظراً لاكتشاف صلاحيات الروت في جهازك.</p>
            
            <div class="action-group">
                <button onclick="openExitDialog()">خروج من التطبيق</button>
            </div>
            
            <div id="roastOutput"></div>
        </div>
    </div>

    <!-- عنصر الـ Dialog الحديث -->
    <dialog class="cyber-dialog" id="exitDialog">
        <h3>تأكيد الخروج</h3>
        <p>هل أنت متأكد أنك تريد المغادرة وترك جهازك يعاني من صدمة الروت؟</p>
        <button onclick="exitApp()">موافق، خروج</button>
    </dialog>

    <script>
        function openExitDialog() {
            const dialog = document.getElementById('exitDialog');
            dialog.showModal();
        }

        function exitApp() {
            window.close();
            window.location.href = "about:blank";
        }
    </script>
</body>
</html>
