<style id="admin-styles">
        :root {
            --header-bg-light: #ffffff;
            --header-text-light: #333333;
            --header-bg: var(--header-bg-light);
            --header-text: var(--header-text-light);
            --drawer-bg-light: #ffffff;
            --drawer-text-light: #333333;
            --drawer-bg: var(--drawer-bg-light);
            --drawer-text: var(--drawer-text-light);
        }
        [data-user-theme="dark"] {
            --header-bg-dark: #1e1e1e;
            --header-text-dark: #e0e0e0;
            --header-bg: var(--header-bg-dark);
            --header-text: var(--header-text-dark);
            --drawer-bg-dark: #1e1e1e;
            --drawer-text-dark: #e0e0e0;
            --drawer-bg: var(--drawer-bg-dark);
            --drawer-text: var(--drawer-text-dark);
        }
        body { margin: 0 !important; padding-top: 56px !important; }
        header { position: fixed; top: 0; left: 0; z-index: 1000; background: var(--header-bg); height: 56px; padding: 0 15px; color: var(--header-text); display: flex; align-items: center; justify-content: space-between; width: 100%; box-sizing: border-box; direction: ltr; }
        .drawer-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 1001; display: none; }
        .drawer { position: fixed; top: 0; width: 280px; height: 100%; background: var(--drawer-bg); color: var(--drawer-text); z-index: 1002; transition: all 0.3s ease; display: flex; flex-direction: column; left: -280px; }
        .drawer.open { left: 0; }
        .drawer-header { padding: 15px; font-weight: bold; border-bottom: 1px solid rgba(0,0,0,0.1); }
        .drawer-menu { list-style: none; padding: 10px 0; margin: 0; }
        .drawer-item { padding: 12px 20px; border-bottom: 1px solid rgba(0,0,0,0.05); cursor: pointer; }
    </style>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<!-- START PASSWORD PROTECTION -->
<style id="page-lock-style">
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { overflow: hidden !important; width: 100% !important; height: 100% !important; }
    #page-lock-screen-protection {
        position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
        background: #f4f6f9; color: #2c3e50; z-index: 9999999;
        display: flex; flex-direction: column; align-items: center; justify-content: center;
        padding: 20px; text-align: center; font-family: system-ui, -apple-system, sans-serif;
    }
    #page-lock-screen-protection .lock-card {
        background: #ffffff; padding: 35px 25px; border-radius: 18px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.06); max-width: 360px; width: 100%; border: 1px solid #e1e8ed;
    }
    #page-lock-screen-protection .lock-icon { font-size: 42px; margin-bottom: 15px; color: #34495e; }
    #page-lock-screen-protection h2 { margin-bottom: 10px; font-size: 1.3rem; color: #2c3e50; font-weight: 700; }
    #page-lock-screen-protection p { margin-bottom: 20px; font-size: 0.95rem; color: #7f8c8d; }
    #page-lock-screen-protection input {
        width: 100%; padding: 12px 15px; border: 1.5px solid #dcdde1; border-radius: 10px;
        font-size: 1rem; text-align: center; margin-bottom: 15px; outline: none;
    }
    #page-lock-screen-protection button {
        width: 100%; background: #18bc9c; color: white; border: none; padding: 12px;
        border-radius: 10px; font-size: 1rem; font-weight: bold; cursor: pointer;
    }
    #page-lock-error-msg { color: #e74c3c; font-size: 0.85rem; margin-top: 10px; display: none; }
</style>
<div id="page-lock-screen-protection">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <div class="lock-card">
        <div class="lock-icon"><i class="fa-solid fa-lock"></i></div>
        <h2>هذه صفحة خاصة!</h2>
        <p>يرجى إدخال كلمة المرور لتستطيع رؤيتها!</p>
        <input type="password" id="page-lock-pass-input" placeholder="كلمة المرور">
        <button onclick="verifyPagePassword()">دخول</button>
        <div id="page-lock-error-msg">كلمة المرور غير صحيحة!</div>
    </div>
</div>
<script>
    const PAGE_PASSWORD = "1234";
    function verifyPagePassword() {
        const inputVal = document.getElementById("page-lock-pass-input").value;
        const errorEl = document.getElementById("page-lock-error-msg");
        if(PAGE_PASSWORD !== "" && inputVal === PAGE_PASSWORD) {
            document.getElementById("page-lock-screen-protection").remove();
            const lockStyle = document.getElementById("page-lock-style");
            if(lockStyle) lockStyle.remove();
        } else {
            errorEl.style.display = "block";
        }
    }
</script>
<!-- END PASSWORD PROTECTION -->




<script id="admin-scripts">
    function toggleDrawer() {
        const drawer = document.getElementById("drawer");
        const overlay = document.getElementById("drawerOverlay");
        drawer.classList.toggle("open");
        overlay.style.display = drawer.classList.contains("open") ? "block" : "none";
    }
    function toggleUserTheme() {
        const current = document.documentElement.getAttribute("data-user-theme");
        if(current === "dark") {
            document.documentElement.removeAttribute("data-user-theme");
        } else {
            document.documentElement.setAttribute("data-user-theme", "dark");
        }
    }
</script>
