<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>الموقع</title>
<style>
  :root{
    --bg:#0f172a;
    --card:#1e293b;
    --border:#334155;
    --text:#f8fafc;
    --muted:#94a3b8;
    --accent:#3b82f6;
    --accent-2:#38bdf8;
    --danger:#ef4444;
    --warn:#f59e0b;
  }
  *{box-sizing:border-box;}
  html,body{height:100%;margin:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'Tahoma','Segoe UI',system-ui,-apple-system,sans-serif;
  }

  /* ===== شريط علوي بسيط (اختياري، فقط لعرض/اختبار التنقل بين الصفحات) ===== */
  #topbar{
    display:flex;
    align-items:center;
    gap:8px;
    padding:10px 16px;
    background:#111827;
    border-bottom:1px solid var(--border);
    position:sticky;
    top:0;
    z-index:20;
  }
  #topbar .nav-link{
    color:var(--muted);
    text-decoration:none;
    font-size:13px;
    padding:6px 12px;
    border-radius:8px;
    border:1px solid transparent;
    cursor:pointer;
    transition:all .15s ease;
  }
  #topbar .nav-link:hover{ color:var(--text); border-color:var(--border); }
  #topbar .nav-link.active{ color:var(--text); background:var(--accent); }
  #topbar .spacer{ flex:1; }
  #topbar .repo-tag{ font-size:11px; color:#475569; }

  /* ===== شريط تحميل علوي رفيع ===== */
  #loading-bar{
    position:fixed; top:0; left:0; height:3px; width:0%;
    background:linear-gradient(90deg,var(--accent),var(--accent-2));
    transition:width .25s ease, opacity .3s ease;
    z-index:50;
  }

  /* ===== منطقة عرض الصفحة (iframe لكل صفحة كمستند مستقل، تمامًا كما كانت تُحمَّل ملفات html كاملة داخل الـ WebView) ===== */
  #page-wrap{ position:relative; height:calc(100vh - 45px); }
  #page-frame{
    width:100%; height:100%; border:0; background:var(--bg);
    opacity:0; transition:opacity .25s ease;
  }
  #page-frame.visible{ opacity:1; }

  /* ===== شاشات الحالة: مغلق / صيانة / 404 ===== */
  .status-screen{
    height:calc(100vh - 45px);
    display:flex; justify-content:center; align-items:center;
    padding:20px;
  }
  .card{
    background:var(--card); padding:30px 20px; border-radius:20px;
    box-shadow:0 20px 25px -5px rgba(0,0,0,.5);
    width:100%; max-width:400px; border:1px solid var(--border);
    display:flex; flex-direction:column; align-items:center; text-align:center;
  }
  .app-logo{ max-width:90px; max-height:90px; margin-bottom:15px; border-radius:16px; object-fit:contain; }
  .icon{ font-size:50px; margin-bottom:12px; }
  .badge{
    display:inline-block; color:#fff; font-size:13px; font-weight:bold;
    padding:5px 14px; border-radius:50px; margin-bottom:15px;
  }
  .card h2{ margin:0 0 10px 0; font-size:20px; color:#fff; font-weight:700; }
  .card p{ margin:0 0 15px 0; font-size:14px; color:var(--muted); line-height:1.6; word-wrap:break-word; }
  .action-btn{
    display:inline-block; width:80%; margin-top:15px; padding:12px 20px;
    background:var(--accent); color:#fff; font-weight:bold; font-size:15px;
    text-decoration:none; border-radius:12px; transition:background .3s;
  }
  .action-btn:hover{ background:#2563eb; }
  .timer-box{ display:flex; justify-content:center; gap:8px; margin-top:15px; width:100%; }
  .time-unit{ background:var(--bg); padding:8px; border-radius:10px; border:1px solid var(--border); min-width:55px; }
  .time-unit span{ display:block; font-size:18px; font-weight:bold; color:var(--accent-2); }
  .time-unit label{ font-size:10px; color:#64748b; }
  .timer-done{ color:#10b981; font-weight:bold; }

  #offline-pill{
    position:fixed; bottom:14px; right:14px; background:#111827;
    border:1px solid var(--border); color:var(--muted); font-size:12px;
    padding:6px 12px; border-radius:999px; display:none; z-index:40;
  }
  #offline-pill.show{ display:block; }
</style>
</head>
<body>

  <div id="loading-bar"></div>

  <div id="topbar">
    <span class="nav-link" data-page="index">index</span>
    <span class="nav-link" data-page="home">home</span>
    <span class="nav-link" data-page="about">about</span>
    <div class="spacer"></div>
    <span class="repo-tag" id="repo-tag"></span>
  </div>

  <div id="page-wrap">
    <iframe id="page-frame" title="page-content"></iframe>
  </div>

  <div id="offline-pill">غير متصل — يتم عرض نسخة مخزّنة محلياً</div>

<script>
(function(){

  // ============================================================
  // إعدادات الحساب والمستودع (نفس فكرة GITHUB_USER / GITHUB_REPO)
  // ============================================================
  const CONFIG = {
    githubUser: "BLOXMAM",
    githubRepo: "webv",
    branch: "main",
    defaultPage: "home"   // الصفحة الافتراضية إن لم يوجد باراميتر في الرابط
  };

  document.getElementById('repo-tag').textContent = CONFIG.githubUser + '/' + CONFIG.githubRepo;

  function rawUrl(path){
    return `https://raw.githubusercontent.com/${CONFIG.githubUser}/${CONFIG.githubRepo}/${CONFIG.branch}/${path}`;
  }

  // ============================================================
  // قراءة اسم الصفحة من الرابط. يدعم كلا الشكلين:
  //   /?=home    (الشكل المطلوب في المثال)
  //   /?page=home  (شكل بديل أوضح، اختياري)
  // ============================================================
  function getPageFromUrl(){
    const search = window.location.search; // مثال: "?=home"
    const params = new URLSearchParams(search);
    const emptyKeyValue = params.get('');   // يلتقط "=home"
    const namedValue = params.get('page');  // يلتقط "page=home"
    return (emptyKeyValue || namedValue || CONFIG.defaultPage).trim();
  }

  function setPageInUrl(name, push){
    const url = '/?=' + encodeURIComponent(name);
    if (push) history.pushState({page:name}, '', url);
    else history.replaceState({page:name}, '', url);
  }

  // ============================================================
  // شريط التحميل العلوي
  // ============================================================
  const loadingBar = document.getElementById('loading-bar');
  function showLoading(){
    loadingBar.style.opacity = '1';
    loadingBar.style.width = '30%';
    setTimeout(()=>{ loadingBar.style.width = '75%'; }, 150);
  }
  function hideLoading(){
    loadingBar.style.width = '100%';
    setTimeout(()=>{
      loadingBar.style.opacity = '0';
      setTimeout(()=>{ loadingBar.style.width = '0%'; }, 300);
    }, 150);
  }

  const offlinePill = document.getElementById('offline-pill');
  function flagOffline(show){ offlinePill.classList.toggle('show', !!show); }

  // ============================================================
  // جلب نص من الرابط، مع رمي خطأ عند 404 أو فشل الشبكة
  // ============================================================
  async function fetchText(url){
    const res = await fetch(url, { cache: "no-store" });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    return await res.text();
  }

  // ============================================================
  // بناء بطاقة الحالة (مغلق / صيانة) — نفس تصميم buildStatusPageHtml الأصلي
  // ============================================================
  function buildStatusScreen(container, opts){
    const { icon, badgeText, badgeBg, title, message, logoUrl, btnText, btnUrl, endTime } = opts;

    container.innerHTML = '';
    const wrap = document.createElement('div');
    wrap.className = 'status-screen';

    const card = document.createElement('div');
    card.className = 'card';

    if (logoUrl && logoUrl.trim()){
      const img = document.createElement('img');
      img.src = logoUrl.trim();
      img.className = 'app-logo';
      img.alt = 'Logo';
      card.appendChild(img);
    } else {
      const iconEl = document.createElement('div');
      iconEl.className = 'icon';
      iconEl.textContent = icon;
      card.appendChild(iconEl);
    }

    const badge = document.createElement('div');
    badge.className = 'badge';
    badge.style.background = badgeBg;
    badge.textContent = badgeText;
    card.appendChild(badge);

    const h2 = document.createElement('h2');
    h2.textContent = title;
    card.appendChild(h2);

    const p = document.createElement('p');
    p.textContent = message;
    card.appendChild(p);

    if (endTime && endTime.trim()){
      const timerBox = document.createElement('div');
      timerBox.className = 'timer-box';
      timerBox.id = 'timer-container';
      ['days','hours','minutes','seconds'].forEach(unit=>{
        const labelMap = {days:'يوم',hours:'ساعة',minutes:'دقيقة',seconds:'ثانية'};
        const u = document.createElement('div');
        u.className = 'time-unit';
        u.innerHTML = `<span id="${unit}">00</span><label>${labelMap[unit]}</label>`;
        timerBox.appendChild(u);
      });
      card.appendChild(timerBox);
      startCountdown(endTime.trim());
    }

    if (btnText && btnText.trim() && btnUrl && btnUrl.trim()){
      const a = document.createElement('a');
      a.href = btnUrl.trim();
      a.className = 'action-btn';
      a.textContent = btnText.trim();
      a.target = '_blank';
      a.rel = 'noopener';
      card.appendChild(a);
    }

    wrap.appendChild(card);
    container.appendChild(wrap);
  }

  let countdownTimer = null;
  function startCountdown(endTimeStr){
    if (countdownTimer) clearInterval(countdownTimer);
    const target = new Date(endTimeStr).getTime();
    if (isNaN(target)) return;

    function tick(){
      const now = Date.now();
      const distance = target - now;
      const container = document.getElementById('timer-container');
      if (!container) { clearInterval(countdownTimer); return; }

      if (distance < 0){
        clearInterval(countdownTimer);
        container.innerHTML = '<div class="timer-done">انتهت المدة المحددة!</div>';
        return;
      }
      const days = Math.floor(distance / 86400000);
      const hours = Math.floor((distance % 86400000) / 3600000);
      const minutes = Math.floor((distance % 3600000) / 60000);
      const seconds = Math.floor((distance % 60000) / 1000);

      const d = document.getElementById('days'), h = document.getElementById('hours'),
            m = document.getElementById('minutes'), s = document.getElementById('seconds');
      if (d) d.textContent = days;
      if (h) h.textContent = hours;
      if (m) m.textContent = minutes;
      if (s) s.textContent = seconds;
    }
    tick();
    countdownTimer = setInterval(tick, 1000);
  }

  // ============================================================
  // فحص app_status.json (مغلق / صيانة) مع تخزين محلي للعمل أوفلاين
  // ============================================================
  async function checkStatus(){
    try{
      const raw = await fetchText(rawUrl('app_status.json'));
      const json = JSON.parse(raw);
      localStorage.setItem('app_status_cache', raw);
      flagOffline(false);
      return json;
    }catch(e){
      const cached = localStorage.getItem('app_status_cache');
      if (cached){
        flagOffline(true);
        try{ return JSON.parse(cached); }catch(_){ /* ignore */ }
      }
      return { is_closed:false, is_maintenance:false };
    }
  }

  function showClosed(status){
    document.getElementById('page-wrap').style.display = 'none';
    let host = document.getElementById('status-host');
    if (!host){ host = document.createElement('div'); host.id = 'status-host'; document.body.appendChild(host); }
    buildStatusScreen(host, {
      icon: '🚫',
      badgeText: 'التطبيق مغلق',
      badgeBg: 'var(--danger)',
      title: status.close_title || 'التطبيق متوقف حالياً',
      message: status.close_message || 'تم إغلاق التطبيق.',
      logoUrl: status.logo_url || '',
      btnText: status.btn_text || '',
      btnUrl: status.btn_url || '',
      endTime: status.end_time || ''
    });
  }

  function showMaintenance(status){
    document.getElementById('page-wrap').style.display = 'none';
    let host = document.getElementById('status-host');
    if (!host){ host = document.createElement('div'); host.id = 'status-host'; document.body.appendChild(host); }
    buildStatusScreen(host, {
      icon: '🛠️',
      badgeText: 'وضع الصيانة',
      badgeBg: 'var(--warn)',
      title: status.maintenance_title || 'الموقع تحت الصيانة',
      message: status.maintenance_message || 'سنعود قريباً!',
      logoUrl: status.logo_url || '',
      btnText: status.btn_text || '',
      btnUrl: status.btn_url || '',
      endTime: status.end_time || ''
    });
  }

  function clearStatusScreen(){
    const host = document.getElementById('status-host');
    if (host) host.remove();
    document.getElementById('page-wrap').style.display = '';
  }

  // ============================================================
  // عرض صفحة 404
  // ============================================================
  async function render404(){
    const frame = document.getElementById('page-frame');
    try{
      const html = await fetchText(rawUrl('404.html'));
      frame.srcdoc = html;
    }catch(e){
      frame.srcdoc = `<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="UTF-8">
        <style>body{margin:0;height:100vh;display:flex;align-items:center;justify-content:center;
        background:#0f172a;color:#f8fafc;font-family:Tahoma,sans-serif;text-align:center;}
        h1{font-size:64px;margin:0;color:#3b82f6;}p{color:#94a3b8;}</style></head>
        <body><div><h1>404</h1><p>الصفحة غير موجودة</p></div></body></html>`;
    }
    frame.classList.add('visible');
  }

  // ============================================================
  // تحميل صفحة معيّنة (تُطلب كـ {name}.html من نفس المستودع) وعرضها داخل iframe
  // مع تخزين محلي (localStorage) للعمل بشكل محدود أوفلاين
  // ============================================================
  async function loadPage(name){
    showLoading();
    const frame = document.getElementById('page-frame');
    frame.classList.remove('visible');

    try{
      const html = await fetchText(rawUrl(`${name}.html`));
      localStorage.setItem('page_cache_' + name, html);
      flagOffline(false);
      frame.srcdoc = html;
      frame.classList.add('visible');
    }catch(e){
      const cached = localStorage.getItem('page_cache_' + name);
      if (cached){
        flagOffline(true);
        frame.srcdoc = cached;
        frame.classList.add('visible');
      } else {
        await render404();
      }
    } finally {
      hideLoading();
    }
  }

  // ============================================================
  // شريط التنقل العلوي (لتجربة التنقل بين index / home / about)
  // ============================================================
  function highlightNav(name){
    document.querySelectorAll('#topbar .nav-link').forEach(el=>{
      el.classList.toggle('active', el.dataset.page === name);
    });
  }

  document.querySelectorAll('#topbar .nav-link').forEach(el=>{
    el.addEventListener('click', ()=>{
      const name = el.dataset.page;
      setPageInUrl(name, true);
      run();
    });
  });

  // ============================================================
  // نقطة الدخول الرئيسية — تعادل onCreate الأصلي:
  // 1) فحص app_status.json أولاً (مغلق / صيانة)
  // 2) إن كان سليماً، تحميل الصفحة المطلوبة من الرابط
  // ============================================================
  async function run(){
    const status = await checkStatus();

    if (status.is_closed){ showClosed(status); return; }
    if (status.is_maintenance){ showMaintenance(status); return; }

    clearStatusScreen();
    const page = getPageFromUrl();
    highlightNav(page);
    setPageInUrl(page, false);
    await loadPage(page);
  }

  window.addEventListener('popstate', run);
  run();

})();
</script>
</body>
</html>
