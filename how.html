<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Loading…</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; background: #0f172a; }
  #app-root { width: 100%; height: 100vh; }
  #app-root iframe { border: 0; width: 100%; height: 100vh; display: block; background: #fff; }

  /* شاشة التحميل الأولية */
  #boot-loader {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    background: #0f172a; z-index: 9999;
  }
  #boot-loader .spinner {
    width: 40px; height: 40px; border: 3px solid #334155; border-top-color: #38bdf8;
    border-radius: 50%; animation: spin 0.8s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div id="boot-loader"><div class="spinner"></div></div>
<div id="app-root"></div>

<script>
(function () {
  "use strict";

  // === [إعدادات الحساب والمستودع] ===
  const GITHUB_USER = "BLOXMAM";
  const GITHUB_REPO = "webv";
  const BRANCH = "main";

  // raw.githubusercontent يُستخدم لجلب JSON/نص (الحالة والإصدار)
  const RAW_BASE = "https://raw.githubusercontent.com/" + GITHUB_USER + "/" + GITHUB_REPO + "/" + BRANCH + "/";
  // jsDelivr يُستخدم لعرض صفحات HTML لأنه يرسل Content-Type صحيح لكل الملفات (css/js/images/fonts)
  // بعكس raw.githubusercontent.com التي ترسل كل شيء كـ text/plain وتمنع تحميل الموارد المرتبطة
  const CDN_BASE = "https://cdn.jsdelivr.net/gh/" + GITHUB_USER + "/" + GITHUB_REPO + "@" + BRANCH + "/";

  const root = document.getElementById("app-root");
  const bootLoader = document.getElementById("boot-loader");

  function hideBootLoader() {
    if (bootLoader) bootLoader.remove();
  }

  // كسر أي كاش (لا نريد عمل offline إطلاقاً، كل تحميل يجب أن يكون حياً من GitHub)
  function bust(url) {
    return url + (url.indexOf("?") === -1 ? "?" : "&") + "t=" + Date.now();
  }

  async function fetchLive(url) {
    const res = await fetch(bust(url), { cache: "no-store" });
    return res;
  }

  // =======================================================
  // 🧭 تحديد الصفحة المطلوبة من الرابط
  // يدعم: example.com/home  و  example.com/?=home  و  example.com/?page=home
  // =======================================================
  function getRequestedPage() {
    const path = window.location.pathname.replace(/^\/+|\/+$/g, "");
    if (path) return path.split("/")[0];

    const params = new URLSearchParams(window.location.search);
    if (params.get("page")) return params.get("page");
    if (params.has("")) return params.get(""); // يغطي صيغة ?=home

    const rawSearch = window.location.search.replace(/^\?/, "");
    if (rawSearch && rawSearch.indexOf("=") === -1) return rawSearch; // يغطي صيغة ?home

    return "home";
  }

  // =======================================================
  // 🔴 بناء صفحة الحالة (مغلق / صيانة) - نفس تصميم النسخة الأصلية للتطبيق
  // =======================================================
  function buildStatusPageHtml(opts) {
    const logoHtml = opts.logoUrl
      ? "<img src='" + opts.logoUrl + "' class='app-logo' alt='Logo' />"
      : "<div class='icon'>" + opts.icon + "</div>";

    const btnHtml = (opts.btnText && opts.btnUrl)
      ? "<a href='" + opts.btnUrl + "' class='action-btn' target='_blank' rel='noopener'>" + opts.btnText + "</a>"
      : "";

    let timerHtml = "";
    let timerScript = "";
    if (opts.endTime) {
      timerHtml =
        "<div id='timer-container' class='timer-box'>" +
        "<div class='time-unit'><span id='days'>00</span><label>يوم</label></div>" +
        "<div class='time-unit'><span id='hours'>00</span><label>ساعة</label></div>" +
        "<div class='time-unit'><span id='minutes'>00</span><label>دقيقة</label></div>" +
        "<div class='time-unit'><span id='seconds'>00</span><label>ثانية</label></div>" +
        "</div>";

      timerScript =
        "<script>" +
        "var targetDate=new Date('" + opts.endTime + "').getTime();" +
        "if(!isNaN(targetDate)){" +
        "var x=setInterval(function(){" +
        "var now=new Date().getTime();var distance=targetDate-now;" +
        "if(distance<0){clearInterval(x);document.getElementById('timer-container').innerHTML='<div style=\"color:#10b981;font-weight:bold;\">انتهت المدة المحددة!</div>';return;}" +
        "document.getElementById('days').innerText=Math.floor(distance/(1000*60*60*24));" +
        "document.getElementById('hours').innerText=Math.floor((distance%(1000*60*60*24))/(1000*60*60));" +
        "document.getElementById('minutes').innerText=Math.floor((distance%(1000*60*60))/(1000*60));" +
        "document.getElementById('seconds').innerText=Math.floor((distance%(1000*60))/1000);" +
        "},1000);}" +
        "<\/script>";
    }

    return (
      "<!DOCTYPE html><html dir='rtl' lang='ar'><head><meta charset='UTF-8'>" +
      "<meta name='viewport' content='width=device-width, initial-scale=1.0'><style>" +
      "body{margin:0;padding:20px;display:flex;justify-content:center;align-items:center;min-height:100vh;background:#0f172a;font-family:system-ui,-apple-system,sans-serif;color:#f8fafc;text-align:center;box-sizing:border-box;}" +
      ".card{background:#1e293b;padding:30px 20px;border-radius:20px;box-shadow:0 20px 25px -5px rgba(0,0,0,.5);width:100%;max-width:400px;border:1px solid #334155;display:flex;flex-direction:column;align-items:center;}" +
      ".app-logo{max-width:90px;max-height:90px;margin-bottom:15px;border-radius:16px;object-fit:contain;}" +
      ".icon{font-size:50px;margin-bottom:12px;}" +
      ".badge{display:inline-block;background-color:" + opts.badgeBg + ";color:#fff;font-size:13px;font-weight:bold;padding:5px 14px;border-radius:50px;margin-bottom:15px;}" +
      "h2{margin:0 0 10px 0;font-size:20px;color:#fff;font-weight:700;}" +
      "p{margin:0 0 15px 0;font-size:14px;color:#94a3b8;line-height:1.6;word-wrap:break-word;}" +
      ".action-btn{display:inline-block;width:80%;margin-top:15px;padding:12px 20px;background:#3b82f6;color:#fff;font-weight:bold;font-size:15px;text-decoration:none;border-radius:12px;}" +
      ".timer-box{display:flex;justify-content:center;gap:8px;margin-top:15px;width:100%;}" +
      ".time-unit{background:#0f172a;padding:8px;border-radius:10px;border:1px solid #334155;min-width:55px;}" +
      ".time-unit span{display:block;font-size:18px;font-weight:bold;color:#38bdf8;}" +
      ".time-unit label{font-size:10px;color:#64748b;}" +
      "</style></head><body><div class='card'>" +
      logoHtml +
      "<div class='badge'>" + opts.badgeText + "</div>" +
      "<h2>" + opts.title + "</h2>" +
      "<p>" + opts.message + "</p>" +
      timerHtml + btnHtml +
      "</div>" + timerScript + "</body></html>"
    );
  }

  function renderIframeDoc(htmlString) {
    hideBootLoader();
    root.innerHTML = "";
    const iframe = document.createElement("iframe");
    iframe.setAttribute("sandbox", "allow-scripts allow-forms allow-popups allow-popups-to-escape-sandbox allow-same-origin");
    root.appendChild(iframe);
    iframe.srcdoc = htmlString;
  }

  function renderRemotePage(page) {
    hideBootLoader();
    root.innerHTML = "";
    const iframe = document.createElement("iframe");
    // jsDelivr يعرض الصفحة والموارد المرتبطة بها (css/js/images) مباشرة وبأنواع MIME صحيحة
    iframe.src = bust(CDN_BASE + page + ".html");
    root.appendChild(iframe);
  }

  function render404() {
    hideBootLoader();
    root.innerHTML = "";
    const iframe = document.createElement("iframe");
    iframe.src = bust(CDN_BASE + "404.html");
    iframe.onerror = function () {
      renderIframeDoc(
        "<!DOCTYPE html><html dir='rtl' lang='ar'><body style='background:#0f172a;color:#f8fafc;font-family:system-ui;display:flex;align-items:center;justify-content:center;height:100vh;margin:0;'>" +
        "<div style='text-align:center;'><h1>404</h1><p>الصفحة غير موجودة</p></div></body></html>"
      );
    };
    root.appendChild(iframe);
  }

  // =======================================================
  // ⚡ التسلسل الرئيسي: فحص app_status.json ثم التوجيه للصفحة المطلوبة
  // كل شيء يُجلب مباشرة من GitHub في كل مرة (بدون أي تخزين أو وضع offline)
  // =======================================================
  async function init() {
    // 1) فحص حالة التطبيق (مغلق / صيانة)
    try {
      const statusRes = await fetchLive(RAW_BASE + "app_status.json");
      if (statusRes.ok) {
        const status = await statusRes.json();
        if (status.is_closed || status.is_maintenance) {
          const isClosed = !!status.is_closed;
          renderIframeDoc(buildStatusPageHtml({
            icon: isClosed ? "🚫" : "🛠️",
            badgeText: isClosed ? "التطبيق مغلق" : "وضع الصيانة",
            badgeBg: isClosed ? "#ef4444" : "#f59e0b",
            title: isClosed ? (status.close_title || "التطبيق متوقف حالياً") : (status.maintenance_title || "تطبيق تحت الصيانة"),
            message: isClosed ? (status.close_message || "تم إغلاق التطبيق.") : (status.maintenance_message || "سنعود قريباً!"),
            logoUrl: status.logo_url || "",
            btnText: status.btn_text || "",
            btnUrl: status.btn_url || "",
            endTime: status.end_time || ""
          }));
          return;
        }
      }
    } catch (e) {
      // تعذر الوصول لملف الحالة، تابع بشكل طبيعي
    }

    // 2) تحديد الصفحة المطلوبة والتحقق من وجودها فعلياً على GitHub قبل عرضها
    const page = getRequestedPage();
    try {
      const check = await fetchLive(RAW_BASE + page + ".html");
      if (!check.ok) {
        render404();
        return;
      }
    } catch (e) {
      render404();
      return;
    }

    renderRemotePage(page);
  }

  init();
})();
</script>
</body>
</html>
